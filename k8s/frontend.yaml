apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: ultra-task

spec:
  replicas: 1

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend
          image: ghcr.io/pro7it/ultra-task-frontend:9cb0d504cf5ad6ba5c83eed322965f94a9854159
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: ultra-task

spec:
  selector:
    app: frontend

  ports:
    - port: 80
      targetPort: 80
