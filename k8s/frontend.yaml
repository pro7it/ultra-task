apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: ultra-task

spec:
  replicas: 1

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend
          image: ultra-task-frontend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: ultra-task

spec:
  selector:
    app: frontend

  ports:
    - port: 80
      targetPort: 80
