apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: ultra-task-ingress
  namespace: ultra-task

spec:
  ingressClassName: nginx

  rules:
    - http:
        paths:
          - path: /tasks
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080

          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
