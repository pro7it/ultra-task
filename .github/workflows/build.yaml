name: Build and Push

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: ghcr.io/pro7it/ultra-task-backend:${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/pro7it/ultra-task-frontend:${{ github.sha }}

  update-manifests:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Update image tags
        run: |
          sed -i "s|image: ghcr.io/pro7it/ultra-task-backend:.*|image: ghcr.io/pro7it/ultra-task-backend:${{ github.sha }}|" k8s/backend.yaml
          sed -i "s|image: ghcr.io/pro7it/ultra-task-frontend:.*|image: ghcr.io/pro7it/ultra-task-frontend:${{ github.sha }}|" k8s/frontend.yaml

      - name: Commit manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/backend.yaml k8s/frontend.yaml

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore: update image tags to ${{ github.sha }}"
          git push
